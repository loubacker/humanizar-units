[package]
name = "humanizar-units"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
backon = { version = "1.6.0", default-features = false, features = ["tokio-sleep"] }
bb8-postgres = "0.9.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
base64 = "0.22.1"
http-body-util = "0.1.3"
rsa = { version = "0.9.10", features = ["pem"] }
serde_json = "1.0"
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }

